name: Node.js CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22.13.0', '22.x', '24.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Test minimum supported Node version
        if: matrix.node-version == '22.13.0'
        run: node --test tests/mcp-lifecycle.test.js
      - name: Run full suite
        if: matrix.node-version != '22.13.0'
        run: npm test
      - name: Test browser review changes
        if: matrix.node-version != '22.13.0'
        run: python -m unittest discover -s tests -p 'test_browser_review_changes.py'
      - name: Check documentation links
        if: matrix.node-version != '22.13.0'
        run: npm run check:docs
